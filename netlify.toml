# deploy-trigger: 2026-07-21T12:54:06.8538569-07:00
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/fencing/grass-valley/"
  to = "https://grassvalleyfencing.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fencing/granite-bay/"
  to = "https://granitebayfencing.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fencing/elk-grove/"
  to = "https://elkgrovefencing.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fencing/folsom/"
  to = "https://folsomfencing.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fencing/roseville/"
  to = "https://rosevillefencingca.com/"
  status = 301
  force = true

[[redirects]]
  from = "/fencing/rocklin/"
  to = "https://rocklinfencing.com/"
  status = 301
  force = true

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
